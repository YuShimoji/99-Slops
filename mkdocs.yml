site_name: GLITCH-WORKER Local Docs
site_description: Local Markdown viewer for audit and browser translation checks.
site_url: ""
docs_dir: docs
site_dir: .mkdocs-site
use_directory_urls: true

theme:
  name: material
  language: ja
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - search.suggest

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - sane_lists
  - toc:
      permalink: true

exclude_docs: |
  .git/**
  .claude/**
  .cursor/**
  .mkdocs-site/**
  site/**
  node_modules/**
  dist/**
  build/**
  .venv/**
  venv/**
  __pycache__/**
  99PercentSlops/**
  shared-workflows/**
  tools/**
  .gitignore
  .gitmodules
  REPORT_CONFIG.yml
  mkdocs.yml

nav:
  - Overview:
      - Local Document View: index.md
      - Project Map: PROJECT_MAP.md
      - Implementation Index: IMPLEMENTATION_INDEX.md
      - Progress Screenshots: screenshots/README.md
      - Project Handover: HANDOVER.md
      - Milestone Plan: MILESTONE_PLAN.md
  - Specs:
      - GDD 1.0: spec/GDD1.0.md
      - Camera System: spec/CAMERA_SYSTEM.md
      - Player Control System: spec/PLAYER_CONTROL_SYSTEM.md
      - Skill Ideas: spec/SKILL_IDEAS.md
